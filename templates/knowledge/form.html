{% extends 'layouts/app.html' %}
{% block title %}{% if knowledge %}编辑知识库{% else %}新建知识库{% endif %}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><h5 class="mb-0"><i class="fa fa-book me-2"></i>{% if knowledge %}编辑知识库{% else %}新建知识库{% endif %}</h5></div>
    <div class="card-body">
        <form method="POST" action="{% if knowledge %}{% url 'knowledge.update' knowledge.id %}{% else %}{% url 'knowledge.store' %}{% endif %}">
            {% csrf_token %}
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">标题 <span class="text-danger">*</span></label>
                <div class="col-sm-9"><input type="text" name="title" class="form-control" value="{% if knowledge %}{{ knowledge.title }}{% endif %}" required maxlength="200"></div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">分类</label>
                <div class="col-sm-4">
                    <select name="cate_id" class="form-select">
                        <option value="">无分类</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}" {% if knowledge and knowledge.cate_id == c.id %}selected{% endif %}>{{ c.title }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">可见范围</label>
                <div class="col-sm-4">
                    <div class="form-check form-switch mt-1">
                        <input class="form-check-input" type="checkbox" name="is_share" value="1" id="isShare" {% if not knowledge or knowledge.is_share %}checked{% endif %}>
                        <label class="form-check-label" for="isShare">共享知识（全员可见；关闭则为个人知识，仅自己可见）</label>
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">简介</label>
                <div class="col-sm-9"><input type="text" name="desc" class="form-control" value="{% if knowledge %}{{ knowledge.desc }}{% endif %}" maxlength="500"></div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">排序</label>
                <div class="col-sm-2"><input type="number" name="sort" class="form-control" value="{% if knowledge %}{{ knowledge.sort }}{% else %}0{% endif %}"></div>
            </div>
            <div class="row">
                <div class="col-sm-9 offset-sm-2">
                    <button class="btn btn-primary">{% if knowledge %}保存修改{% else %}创建{% endif %}</button>
                    <a href="{% url 'knowledge.index' %}" class="btn btn-outline-secondary">取消</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
