{% extends 'layouts/app.html' %}
{% block title %}角色管理{% endblock %}
{% block content %}
<h1 class="mb-4">角色管理</h1>
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>角色列表</span>
        <a href="{% url 'admin.roles.create' %}" class="btn btn-sm btn-primary"><i class="fa fa-plus"></i> 新建角色</a>
    </div>
    <div class="card-body"><div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>ID</th><th>名称</th><th>编码</th><th>操作</th></tr></thead>
            <tbody>
            {% for r in roles %}
            <tr><td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.code }}</td>
                <td>
                    <a href="{% url 'admin.roles.edit' r.id %}" class="btn btn-sm btn-outline-primary"><i class="fa fa-edit"></i></a>
                    <form action="{% url 'admin.roles.destroy' r.id %}" method="POST" style="display:inline;" onsubmit="return confirm('确定删除角色 {{ r.name }} ？');">{% csrf_token %}<button class="btn btn-sm btn-outline-danger"><i class="fa fa-trash"></i></button></form>
                </td></tr>
            {% empty %}<tr><td colspan="4" class="text-center text-muted">暂无角色</td></tr>{% endfor %}
            </tbody>
        </table>
    </div></div>
</div>
{% endblock %}
