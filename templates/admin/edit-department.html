{% extends 'layouts/app.html' %}
{% block title %}编辑部门{% endblock %}
{% block content %}
<h1 class="mb-4">编辑部门：{{ department.name }}</h1>
<div class="card"><div class="card-body">
<form method="POST" action="{% url 'admin.departments.update' department.id %}">{% csrf_token %}
<table class="table table-bordered form-table mb-0">
<tr><td class="form-table-label">部门名称 <font color="red">*</font></td><td><input name="name" class="form-control" value="{{ department.name }}" required></td></tr>
<tr><td class="form-table-label">部门编码 <font color="red">*</font></td><td><input name="code" class="form-control" value="{{ department.code }}" required></td></tr>
<tr><td class="form-table-label">类型 <font color="red">*</font></td><td><select name="type" class="form-control"><option value="project" {% if department.type == 'project' %}selected{% endif %}>项目部门</option><option value="non-project" {% if department.type == 'non-project' %}selected{% endif %}>非项目部门</option></select></td></tr>
<tr><td class="form-table-label">排序 <font color="red">*</font></td><td><input type="number" name="sort_order" class="form-control" value="{{ department.sort_order }}" required></td></tr>
</table>
<div class="pt-3"><button class="btn btn-primary"><i class="fa fa-check"></i> 保存</button> <a href="{% url 'admin.departments' %}" class="btn btn-outline-secondary">返回</a></div>
</form>
</div></div>
<style>.form-table td{padding:12px 16px!important;vertical-align:middle}.form-table-label{width:130px;background-color:#f8f9fa!important;font-weight:600}</style>
{% endblock %}
