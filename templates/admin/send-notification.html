{% extends 'layouts/app.html' %}
{% block title %}发送通知{% endblock %}
{% block content %}
<h1 class="mb-4">发送系统通知</h1>
{% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="{% url 'admin.notification.post' %}">
            {% csrf_token %}
            <div class="form-group mb-3">
                <label for="title">通知标题 <font color="red">*</font></label>
                <input type="text" name="title" id="title" class="form-control" maxlength="255" required>
            </div>
            <div class="form-group mb-3">
                <label for="content">通知内容 <font color="red">*</font></label>
                <textarea name="content" id="content" rows="5" class="form-control" required></textarea>
            </div>
            <div class="form-text mb-3">该通知将发送给所有用户。</div>
            <button type="submit" class="btn btn-primary"><i class="fa fa-send"></i> 立即发送</button>
        </form>
    </div>
</div>
{% endblock %}
