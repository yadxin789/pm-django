{% extends 'layouts/app.html' %}
{% block title %}编辑用户{% endblock %}
{% block content %}
<h1 class="mb-4">编辑用户：{{ user.name }}</h1>
{% if messages %}{% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
<div class="card"><div class="card-body">
<form method="POST" action="{% url 'admin.users.update' user.id %}">{% csrf_token %}
<table class="table table-bordered form-table mb-0">
<tr><td class="form-table-label">用户名 <font color="red">*</font></td><td><input name="username" class="form-control" value="{{ user.username }}" required maxlength="255"></td></tr>
<tr><td class="form-table-label">姓名 <font color="red">*</font></td><td><input name="name" class="form-control" value="{{ user.name }}" required></td></tr>
<tr><td class="form-table-label">密码</td><td><input type="password" name="password" class="form-control" placeholder="留空则不修改密码"></td></tr>
<tr><td class="form-table-label">部门 <font color="red">*</font></td><td><select name="department_id" class="form-control" required>{% for d in departments %}<option value="{{ d.id }}" {% if user.department_id == d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></td></tr>
<tr><td class="form-table-label">角色 <font color="red">*</font></td><td><select name="role_id" class="form-control" required>{% for r in roles %}<option value="{{ r.id }}" {% if user.role_id == r.id %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></td></tr>
<tr><td class="form-table-label">启用账号</td><td><input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %}> 允许登录</td></tr>
</table>
<div class="pt-3"><button class="btn btn-primary"><i class="fa fa-check"></i> 保存</button> <a href="{% url 'admin.users' %}" class="btn btn-outline-secondary">返回</a></div>
</form>
</div></div>
<style>.form-table td{padding:12px 16px!important;vertical-align:middle}.form-table-label{width:130px;background-color:#f8f9fa!important;font-weight:600}</style>
{% endblock %}
