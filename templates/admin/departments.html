{% extends 'layouts/app.html' %}
{% block title %}部门管理{% endblock %}
{% block content %}
<h1 class="mb-4">部门管理</h1>
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>部门列表</span>
        <a href="{% url 'admin.departments.create' %}" class="btn btn-sm btn-primary"><i class="fa fa-plus"></i> 新建部门</a>
    </div>
    <div class="card-body"><div class="table-responsive">
        <table class="table table-striped">
            <thead><tr><th>ID</th><th>名称</th><th>编码</th><th>类型</th><th>排序</th><th>操作</th></tr></thead>
            <tbody>
            {% for d in departments %}
            <tr><td>{{ d.id }}</td><td>{{ d.name }}</td><td>{{ d.code }}</td><td>{{ d.get_type_display }}</td><td>{{ d.sort_order }}</td>
                <td>
                    <a href="{% url 'admin.departments.edit' d.id %}" class="btn btn-sm btn-outline-primary"><i class="fa fa-edit"></i></a>
                    <form action="{% url 'admin.departments.destroy' d.id %}" method="POST" style="display:inline;" onsubmit="return confirm('确定删除部门 {{ d.name }} 及其所有用户和任务？此操作不可恢复！');">{% csrf_token %}<button class="btn btn-sm btn-outline-danger"><i class="fa fa-trash"></i></button></form>
                </td></tr>
            {% empty %}<tr><td colspan="6" class="text-center text-muted">暂无部门</td></tr>{% endfor %}
            </tbody>
        </table>
    </div></div>
</div>
{% endblock %}
