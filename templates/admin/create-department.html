{% extends 'layouts/app.html' %}
{% block title %}新建部门{% endblock %}
{% block content %}
<h1 class="mb-4">新建部门</h1>
<div class="card"><div class="card-body">
<form method="POST" action="{% url 'admin.departments.store' %}">{% csrf_token %}
<table class="table table-bordered form-table mb-0">
<tr><td class="form-table-label">部门名称 <font color="red">*</font></td><td><input name="name" class="form-control" required></td></tr>
<tr><td class="form-table-label">部门编码 <font color="red">*</font></td><td><input name="code" class="form-control" required></td></tr>
<tr><td class="form-table-label">类型 <font color="red">*</font></td><td><select name="type" class="form-control"><option value="project">项目部门</option><option value="non-project">非项目部门</option></select></td></tr>
<tr><td class="form-table-label">排序 <font color="red">*</font></td><td><input type="number" name="sort_order" class="form-control" value="0" required></td></tr>
</table>
<div class="pt-3"><button class="btn btn-primary"><i class="fa fa-check"></i> 保存</button> <a href="{% url 'admin.departments' %}" class="btn btn-outline-secondary">返回</a></div>
</form>
</div></div>
<style>.form-table td{padding:12px 16px!important;vertical-align:middle}.form-table-label{width:130px;background-color:#f8f9fa!important;font-weight:600}</style>
{% endblock %}
