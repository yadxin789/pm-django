{% extends 'layouts/app.html' %}
{% block title %}发送部门通知{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fa fa-bell me-2 text-success"></i>发送部门通知</h1>
    <a href="{% url 'support.index' %}" class="btn btn-outline-secondary"><i class="fa fa-arrow-left me-1"></i>返回支援中心</a>
</div>
<div class="card"><div class="card-body">
    <p class="text-muted">通知将发送给本部门全体成员。</p>
    <form method="POST" action="{% url 'support.notification.post' %}">{% csrf_token %}
        <div class="mb-3"><label class="form-label">通知标题 *</label><input type="text" name="title" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">通知内容 *</label><textarea name="content" class="form-control" rows="6" required></textarea></div>
        <button type="submit" class="btn btn-success"><i class="fa fa-paper-plane me-1"></i>发送通知</button>
    </form>
</div></div>
{% endblock %}
