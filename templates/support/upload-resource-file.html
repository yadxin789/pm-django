{% extends 'layouts/app.html' %}
{% block title %}上传资料文件{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fa fa-upload me-2 text-primary"></i>上传资料文件</h1>
    <a href="{% url 'support.index' %}" class="btn btn-outline-secondary"><i class="fa fa-arrow-left me-1"></i>返回支援中心</a>
</div>
<div class="card"><div class="card-body">
    <form method="POST" action="{% url 'support.store-resource-file' %}" enctype="multipart/form-data">{% csrf_token %}
        <div class="mb-3"><label class="form-label">选择文件 *</label><input type="file" name="file" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">分类 *</label>
            <select name="category" class="form-control" required>
                {% for key, label in categories.items %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div class="mb-3"><label class="form-label">可见范围 *</label>
            <select name="visibility" class="form-control" required>
                {% for key, label in visibility_options.items %}<option value="{{ key }}">{{ label }}</option>{% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fa fa-upload me-1"></i>上传文件</button>
    </form>
</div></div>
{% endblock %}
