{% extends 'layouts/app.html' %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="container">
    <h1 class="mb-4">修改密码</h1>
    <div class="card">
        <div class="card-body">
            <form method="POST" action="{% url 'profile.password.update' %}">
                {% csrf_token %}
                <table class="table table-bordered form-table mb-0">
                    <tr>
                        <td class="form-table-label">旧密码<font color="red">*</font></td>
                        <td><input type="password" name="old_password" class="form-control" placeholder="请输入旧密码" required></td>
                    </tr>
                    <tr>
                        <td class="form-table-label">新密码<font color="red">*</font></td>
                        <td><input type="password" name="password" class="form-control" placeholder="新密码长度不能少于 6 位" minlength="6" required></td>
                    </tr>
                    <tr>
                        <td class="form-table-label">确认新密码<font color="red">*</font></td>
                        <td><input type="password" name="password_confirmation" class="form-control" placeholder="再次输入新密码" required></td>
                    </tr>
                </table>
                <div class="pt-4">
                    <button type="submit" class="btn btn-primary"><i class="fa fa-check"></i> 保存</button>
                    <a href="{% url 'profile.edit' %}" class="btn btn-outline-secondary">取消</a>
                </div>
            </form>
            <small class="text-muted d-block mt-3">修改成功后需使用新密码重新登录。</small>
        </div>
    </div>
</div>
<style>
    .form-table td { padding: 12px 16px !important; vertical-align: middle; }
    .form-table-label { width: 130px; background-color: #f8f9fa !important; font-weight: 600; color: #495057; }
</style>
{% endblock %}
